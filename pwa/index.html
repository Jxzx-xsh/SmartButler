<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0FB8C9" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0FB8C9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D2A30" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="SmartButler — 食材/物品管理与到期提醒" />
    <title>SmartButler</title>
    <!-- 启动占位样式：内联在 head，在 JS/CSS bundle 到达前即可生效，消除打开 PWA 时的白屏。
         自给自足、不依赖 global.css 变量，颜色与 global.css 的 --color-bg/品牌色对齐。 -->
    <style id="splash-style">
      #app-splash {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100vw;
        width: 100dvw;
        width: 100lvw;
        height: 100vh;
        height: 100dvh;
        height: 100lvh;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* 背景色去掉，跟随 body 渐变底色 */
        background: transparent;
        color: #15242a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', Roboto, sans-serif;
      }
      #app-splash .splash-logo {
        width: 72px;
        height: 72px;
        display: block;
      }
      #app-splash .splash-name {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      /* 轻量加载动画：蓝青脉动圆点（iOS 风蓝青 #0FB8C9） */
      #app-splash .splash-dots {
        display: flex;
        gap: 8px;
      }
      #app-splash .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0fb8c9;
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      #app-splash .splash-dots span:nth-child(2) {
        animation-delay: 0.2s;
      }
      #app-splash .splash-dots span:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes splash-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: scale(0.8);
        }
        40% {
          opacity: 1;
          transform: scale(1);
        }
      }
      /* 深色适配：背景同样透明，跟随 body 深色调 */
      @media (prefers-color-scheme: dark) {
        #app-splash {
          background: transparent;
          color: #eaf2f4;
        }
        #app-splash .splash-dots span {
          background: #36d6e6;
        }
      }
      /* 尊重「减弱动态效果」：关闭动画，显示静态圆点 */
      @media (prefers-reduced-motion: reduce) {
        #app-splash .splash-dots span {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img class="splash-logo" src="/favicon.svg" width="72" height="72" alt="SmartButler" />
        <div class="splash-name">SmartButler</div>
        <div class="splash-dots" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
